name: evals

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.claude-plugin/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which cases to run'
        type: choice
        default: cheap
        options:
          - cheap      # integrity + negative, no fan-out (~$0.40, ~1 min)
          - fanout     # real subagent swarms      (~$6,    ~12 min)
          - all
        required: true

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

# One run per ref. Superseded commits stop burning API credit.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Free, deterministic, runs everywhere including fork PRs.
  checks:
    name: manifest + docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions agree across every manifest field
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib

          plugin = json.load(open('.claude-plugin/plugin.json'))
          market = json.load(open('.claude-plugin/marketplace.json'))

          found = {
              '.claude-plugin/plugin.json :: version': plugin['version'],
              '.claude-plugin/marketplace.json :: metadata.version': market['metadata']['version'],
              '.claude-plugin/marketplace.json :: plugins[0].version': market['plugins'][0]['version'],
          }

          changelog = pathlib.Path('CHANGELOG.md').read_text()
          m = re.search(r'^## \[(\d+\.\d+\.\d+)\]', changelog, re.M)
          if not m:
              sys.exit('CHANGELOG.md has no released "## [x.y.z]" heading.')
          found['CHANGELOG.md :: latest release heading'] = m.group(1)

          for label, value in found.items():
              print(f'  {value:10}  {label}')

          if len(set(found.values())) != 1:
              sys.exit('\nVersion strings disagree. All four must match.')
          print('\nAll version strings agree.')
          PY

      - name: Manifests are valid JSON and structurally sound
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          plugin = json.load(open('.claude-plugin/plugin.json'))
          market = json.load(open('.claude-plugin/marketplace.json'))
          errors = []

          for key in ('name', 'version', 'description', 'author', 'license'):
              if key not in plugin:
                  errors.append(f'plugin.json is missing "{key}"')

          # The skill directory the loader looks for is derived from the plugin name.
          skill = pathlib.Path('skills') / plugin['name'] / 'SKILL.md'
          if not skill.is_file():
              errors.append(f'plugin.json name "{plugin["name"]}" implies {skill}, which does not exist')

          evals_dir = pathlib.Path(plugin.get('experimental', {}).get('evals', 'evals'))
          if not evals_dir.is_dir():
              errors.append(f'experimental.evals points at {evals_dir}, which does not exist')

          if market['plugins'][0]['name'] != plugin['name']:
              errors.append('marketplace.json plugins[0].name does not match plugin.json name')

          if errors:
              sys.exit('\n'.join(errors))
          print(f'Manifests OK. Skill at {skill}, evals at {evals_dir}/.')
          PY

      - name: Every eval case has a grader and declared runs
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib, re, sys, yaml

          # A case is either prompt.md + graders/*.md, or a single case.yaml.
          # case.yaml exists for cases needing keys prompt.md frontmatter does
          # not accept — scaffold_script and add_dirs are the ones that matter.
          errors = []
          cases = sorted(p for p in pathlib.Path('evals').iterdir() if p.is_dir() and p.name != 'results')
          if not cases:
              sys.exit('No eval cases found under evals/.')

          for case in cases:
              prompt, spec = case / 'prompt.md', case / 'case.yaml'

              if spec.is_file():
                  if prompt.is_file():
                      errors.append(f'{case.name}: has both case.yaml and prompt.md; pick one')
                  try:
                      doc = yaml.safe_load(spec.read_text()) or {}
                  except yaml.YAMLError as e:
                      errors.append(f'{case.name}: case.yaml is not valid YAML — {str(e).splitlines()[0]}')
                      continue
                  if not doc.get('graders'):
                      errors.append(f'{case.name}: case.yaml declares no graders')
                  if not isinstance(doc.get('runs'), int):
                      errors.append(f'{case.name}: case.yaml declares no "runs:"')
                  if not doc.get('tags'):
                      errors.append(f'{case.name}: case.yaml declares no "tags:"')
                  script = (doc.get('context') or {}).get('scaffold_script')
                  if script and not (case / script).is_file():
                      errors.append(f'{case.name}: scaffold_script "{script}" does not exist')
                  continue

              if not prompt.is_file():
                  errors.append(f'{case.name}: no prompt.md and no case.yaml')
                  continue
              graders = list((case / 'graders').glob('*.md')) if (case / 'graders').is_dir() else []
              if not graders:
                  errors.append(f'{case.name}: no graders/*.md')
              text = prompt.read_text()
              if not re.search(r'^runs:\s*\d+', text, re.M):
                  errors.append(f'{case.name}: prompt.md declares no "runs:"')
              if not re.search(r'^tags:\s*\[', text, re.M):
                  errors.append(f'{case.name}: prompt.md declares no "tags:"')

          if errors:
              sys.exit('\n'.join(errors))
          print(f'{len(cases)} eval cases, each with a grader and declared runs/tags.')
          PY

      - name: Frontmatter is valid YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml

          bad = 0
          checked = 0
          for f in sorted(pathlib.Path('.').rglob('*.md')):
              if 'node_modules' in f.parts or 'results' in f.parts:
                  continue
              lines = f.read_text().split('\n')
              if not lines or lines[0].strip() != '---':
                  continue
              try:
                  end = lines.index('---', 1)
              except ValueError:
                  print(f'{f}: frontmatter is never closed')
                  bad += 1
                  continue
              checked += 1
              try:
                  yaml.safe_load('\n'.join(lines[1:end]))
              except yaml.YAMLError as e:
                  # The usual cause is an unquoted scalar containing ": ",
                  # which YAML reads as a nested mapping. GitHub refuses to
                  # render the file, and a strict loader refuses to load it.
                  print(f'{f}: {str(e).splitlines()[0]}')
                  bad += 1

          print(f'{checked} frontmatter blocks parsed, {bad} invalid')
          sys.exit(1 if bad else 0)
          PY

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  evals:
    name: eval suite
    needs: checks
    runs-on: ubuntu-latest
    # The job has to outlast the suite it launches, or it is cancelled mid-run --
    # and a cancelled job also skips the `if: always()` artifact upload below, so
    # the API spend is lost with no eval-result.json to look at. A flat 30 was
    # shorter than a single case: investigation-full-fanout alone declares
    # timeout_seconds: 2400 (40 min).
    #
    # Ceilings, as timeout_seconds x runs summed over the cases each suite selects:
    # cheap 88 min (concurrency 1), fanout 60 min and all 104 min (concurrency 2).
    # Those are pathological -- every run of every case burning its full budget.
    # Measured: cheap ~4 min, and investigation-full-fanout ~15 min per run.
    # These values clear the realistic time by a wide margin while still killing a
    # genuinely hung job; only `all` is given its full theoretical ceiling.
    timeout-minutes: ${{ (github.event.inputs.suite == 'all' && 150) || (github.event.inputs.suite == 'fanout' && 90) || 45 }}
    # Fork PRs never receive repository secrets, so the eval arm cannot run on
    # them. It is skipped rather than failed; `checks` above is the gate that
    # applies to every contributor.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Pinned, not `curl | bash`: CI must test the version the README claims.
      - name: Install Claude Code 2.1.269
        run: npm install -g @anthropic-ai/claude-code@2.1.269

      - name: Confirm the API key is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set for this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Select suite
        id: suite
        run: |
          # The fan-out arm needs --scaffold (investigation-full-fanout builds its
          # own fixture) and --allow-tools Write (researchers write to _raw/).
          # Both are gated by default and neither is implied by --trust-plugin.
          case "${{ github.event.inputs.suite || 'cheap' }}" in
            fanout) echo 'args=--tag fanout --concurrency 2 --scaffold --allow-tools Write Edit' >> "$GITHUB_OUTPUT"
                    echo 'budget=14'                                    >> "$GITHUB_OUTPUT" ;;
            all)    echo 'args=--concurrency 2 --scaffold --allow-tools Write Edit' >> "$GITHUB_OUTPUT"
                    echo 'budget=18'                                    >> "$GITHUB_OUTPUT" ;;
            *)      echo 'args=--tag integrity --tag negative'          >> "$GITHUB_OUTPUT"
                    echo 'budget=5'                                     >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            ${{ steps.suite.outputs.args }} \
            --runs 1 --ablation none \
            --trust-plugin --no-publish \
            --threshold 1.0 \
            --max-cost-usd ${{ steps.suite.outputs.budget }} \
            --json eval-result.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-result
          path: eval-result.json
          if-no-files-found: ignore
