schema_version: "1.0"
name: investigation-full-fanout
description: >-
  A real end-to-end fan-out over a four-unit fixture. Proves that the matrix
  print, the derived count, the cross-cutting traces, the disk discipline, the
  layered fan-in, and the coverage audit all actually execute rather than being
  described. Written as case.yaml rather than prompt.md because it needs
  scaffold_script, which prompt.md frontmatter does not accept.

  This case tests the MACHINERY, not spontaneous triggering. The fixture is
  deliberately tiny so the run stays cheap, which puts it below the size where
  the skill would normally decline the fan-out — so the prompt overrides the
  decline explicitly. That the skill declines small material unprompted is
  covered by investigation-degrades-on-single-unit, and its behaviour at real
  scale is not covered by any committed case, because a fixture large enough to
  need twenty agents costs more per run than this suite is worth.

tags: [investigation, fanout]
runs: 1

context:
  # Requires --scaffold. Without it the harness warns and runs the case against
  # an empty workspace, where it would fail for the wrong reason.
  scaffold_script: scaffold.sh

execution:
  # Pinned to a mid-tier model. This case grades orchestration structure, not
  # analysis quality, and the fan-out is where essentially all the tokens go —
  # unpinned it cost $19.30 for 18 agents, then $11.50 for 15. Pinned it is a
  # case a maintainer will actually run.
  #
  # It also tests something worth knowing on its own. If the procedure only
  # holds together on the strongest available model, this case goes red and
  # says so, which is a fact about the skill rather than about the harness.
  model: sonnet
  max_turns: 90
  timeout_seconds: 2400
  prompt: |
    Audit this repo end to end — every workspace, and I want the seams between
    them covered too. The thing I care about most is how a checkout gets from
    the web client all the way to a charge actually being made.

    I know the repo is small, and I know the method would normally tell me to
    skip the fan-out at this size. Run it anyway — I'm exercising the pipeline
    end to end and I want the real artefacts on disk, researchers and traces and
    synthesizers, not a recommendation to read the files myself.

    Three scopes only please — cartography, architecture, security. Cap it at 8
    agents. Don't stop to ask me for approval, just run it. Put everything under
    .investigation/.

graders:
  - type: tool_used
    name: fanout-actually-happened
    tool: Agent
    min: 8
    weight: 1

  - type: file_exists
    name: inventory-written
    path: .investigation/_meta/inventory.md
    weight: 1

  - type: file_exists
    name: coverage-grid-written
    path: .investigation/_meta/coverage.md
    weight: 1

  - type: regex
    name: raw-files-follow-the-naming-convention
    target: files
    pattern: "_raw/[A-Za-z0-9._-]+--[A-Za-z-]+\\.md"
    weight: 1

  - type: regex
    name: trace-files-exist
    target: files
    pattern: "_raw/trace--[A-Za-z0-9._-]+\\.md"
    weight: 1

  # Targets the trace, not last_message. The matrix is printed BEFORE the
  # researchers spawn, so it lands mid-run; the final message is the delivered
  # audit and has no reason to repeat it. Graded on last_message this failed a
  # run whose matrix had in fact been printed exactly as specified.
  - type: regex
    name: matrix-printed-as-a-table
    target: trace
    pattern: "\\|[^\\n|]*unit[^\\n|]*\\|[^\\n|]*tier[^\\n|]*\\|"
    flags: "i"
    weight: 1

  - type: llm
    name: disk-discipline-held
    focus: trace
    criteria: |
      Read the execution trace, not the final answer. This grades whether full
      findings stayed on disk instead of travelling through context.

      PASS requires all of:

      1. Researcher subagents were told to write their findings to a file under
         _raw/ and to return a short abstract. The prompts say both.
      2. What researchers actually returned to the orchestrator is short —
         roughly a file path plus a handful of bullet lines each. A researcher
         returning multiple paragraphs of findings is a FAIL, because the
         120-word abstract contract is the mechanism that lets this scale.
      3. Synthesizer subagents were given file PATHS to read, not file contents
         pasted into their prompts. Pasting a _raw/ file into a synthesizer
         prompt is the collapse this design exists to prevent and is a FAIL.
      4. At least one synthesizer is scoped to a single unit, and at least one
         is scoped to the seams between units or to the overall deliverable.

      FAIL if the orchestrator asked researchers to report their findings
      directly, or if there is no evidence any file was written under _raw/.

      Do not penalise a run for the number of agents, for which units got which
      scopes, or for the quality of the findings. Only the routing is graded
      here. The fixture is deliberately tiny, so abstracts may be short and
      files thin — that is expected and is not a failure of disk discipline.
    weight: 1

  # Graded against the coverage file itself, not last_message. The delivered
  # report correctly summarises the grid and points at _meta/coverage.md rather
  # than pasting a full unit x scope table into chat — so a grid-completeness
  # rubric aimed at last_message fails a run that did exactly the right thing.
  # Same target mismatch as matrix-printed-as-a-table above.
  - type: llm
    name: coverage-grid-is-complete
    focus:
      source: file
      path: .investigation/_meta/coverage.md
    criteria: |
      Grade the coverage grid on its own terms. This file is the run's account
      of what it did and did not cover.

      PASS requires all of:

      1. A grid appears with units down and analysis scopes across.
      2. Every cell is accounted for — each one either names a file or carries
         an explicit "N/A" WITH a reason. A blank cell is a FAIL. "N/A" with no
         reason is a blank cell with punctuation, and also a FAIL.
      3. Cross-cutting threads are listed, each with a trace file.
      4. Any gap is stated as a gap rather than glossed. A run that reduced a
         unit's scopes and says so plainly is passing, not failing — the grid
         exists to make exactly that visible.

      The fixture is tiny and synthetic and the prompt overrides the skill's own
      advice to skip a fan-out at this size. Do not penalise a short grid, a
      unit with little to report, or a run that covered fewer scopes than asked
      for PROVIDED the shortfall is disclosed in the grid.

      Judge only this file. Do not speculate about what the chat report said.
    weight: 1

  - type: llm
    name: report-is-honest-about-the-run
    focus: last_message
    criteria: |
      Grade the delivered report for honesty about what the run actually did.

      PASS requires all of:

      1. It states the scale of the run in real numbers — how many agents, and
         what they were (recon, researchers, traces, synthesizers). A vague
         "several agents" is a FAIL.
      2. If the run deviated from what the caller asked — a different agent
         count, fewer scopes, a cap it could not meet — it SAYS SO. Disclosing
         a deviation is a pass; silently absorbing one is the failure this
         grader exists to catch.
      3. Any coverage gap is surfaced in the report itself, not left only in
         the files. The reader of the summary must learn that it exists.
      4. Findings are specific and locatable — file paths, identifiers, exact
         values. A report of themes with nothing a reader could go and check
         is a FAIL.

      It is a PASS for the report to summarise and point at
      .investigation/_meta/coverage.md rather than paste a full grid into chat.
      The grid is graded separately, against that file.

      Do not grade the security or architecture findings on their merits. The
      fixture is synthetic; only specificity and honesty are being judged.
    weight: 1
